# Local development configuration. Environment variables such as DATABASE_URL
# and JWT_SECRET continue to override the values read by the server directly.
[http]
bind_addr = "127.0.0.1"
bind_port = 8080
max_payload_size_bytes = "16MiB"
cors = {}

[logging]
format = "pretty"

[import.json]
enabled = true
max_file_bytes = 10485760
default_dataset = "data"

# Load the example ERP schema and data after migrations on every development
# boot. The import is idempotent and refreshes records by their unique codes.
[dev.bootstrap]
enabled = true
content_types = "examples/content-types/erp.json"
data = "examples/content-types/erp-sample.json"
