[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# `release.yml` is generated but customized after generation (tag trigger
# limited to the `v<version>` application tag plus a `workflow_dispatch`
# trigger, because the tag is created with the default GITHUB_TOKEN and
# therefore does not trigger workflows). Re-apply those edits with
# `python3 scripts/patch_release_workflow.py` after regenerating, and keep
# `allow-dirty` so cargo-dist accepts the difference from its template.
allow-dirty = ["ci"]
# cargo-dist creates the one and only GitHub Release, on the `v<version>` tag:
# release-plz is configured with `git_release_enable = false` so it does not
# create a release per crate. dist puts the shell installer (i.e. the
# `curl --proto '=https' --tlsv1.2 -LsSf ... | sh` instructions) and the
# checksums on it; `build.yml` then appends the Docker image tarball, the Helm
# chart and their install instructions to the same release.
create-release = true

# Whether to install an updater program
install-updater = false
