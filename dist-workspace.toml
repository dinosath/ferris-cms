[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# `release.yml` is generated but customized after generation (tag trigger
# limited to the dist-able packages plus a `workflow_dispatch` trigger, because
# release-plz's tags are pushed with the default GITHUB_TOKEN and do not
# trigger workflows). Re-apply those edits with
# `python3 scripts/patch_release_workflow.py` after regenerating, and keep
# `allow-dirty` so cargo-dist accepts the difference from its template.
allow-dirty = ["ci"]
# release-plz creates the GitHub Releases (its tags are the ones we release
# from), so dist must NOT create them itself. With `create-release = false`
# dist assumes the release for the tag already exists and only uploads the
# archives/installers to it.
create-release = false

# Whether to install an updater program
install-updater = false
