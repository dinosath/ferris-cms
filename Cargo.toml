[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/core-schema",
    "crates/api-types",
    "crates/db",
    "crates/dynamic-store",
    "crates/workflow",
    "crates/ai",
    "crates/services",
    "crates/api-rest",
    "crates/client-core",
    "crates/ui",
    "crates/app",
    "crates/server-bin",
    "crates/desktop-bin",
    "crates/e2e",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/1jehuang/jcode"

[workspace.dependencies]
# internal
core-domain = { path = "crates/core-domain" }
core-schema = { path = "crates/core-schema" }
api-types = { path = "crates/api-types" }
db = { path = "crates/db" }
dynamic-store = { path = "crates/dynamic-store" }
workflow = { path = "crates/workflow" }
ai = { path = "crates/ai" }
services = { path = "crates/services" }
api-rest = { path = "crates/api-rest" }
client-core = { path = "crates/client-core" }
ui = { path = "crates/ui" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
csv = "1.3"
serde_yaml = "0.9"

sea-orm = { version = "2.0", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
    "rbac",
] }
sea-orm-migration = "2.0"
sea-query = "1.0"

axum = { version = "0.8", features = ["multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }

jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.9"
url = "2"
openidconnect = { version = "3", default-features = false, features = ["reqwest", "rustls-tls"] }

# e2e testing (Turso database + Obscura browser, no containers)
playwright-rs = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
