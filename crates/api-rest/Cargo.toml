[package]
name = "api-rest"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-domain = { workspace = true }
core-schema = { workspace = true }
api-types = { workspace = true }
services = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_urlencoded = "0.7"
# Embed the Dioxus WASM admin UI into the server binary so the deployment is a
# single self-contained executable. `mime_guess` provides content types for the
# embedded assets.
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
db = { workspace = true }
sea-orm-migration = { workspace = true }
dynamic-store = { workspace = true }
