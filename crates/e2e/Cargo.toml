[package]
name = "e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Playwright (playwright-rs) end-to-end tests for ferriscms against a local Turso database and the Obscura headless browser (no containers)"

[dependencies]
playwright-rs = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# rustls TLS avoids requiring system OpenSSL/pkg-config.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"

# native-tls (pulled transitively by playwright-rs via tokio-tungstenite) needs
# OpenSSL. Building it vendored keeps the build self-contained (no system
# libssl-dev/root required).
openssl = { version = "0.10", features = ["vendored"] }

# In-process ferriscms server under test.
db = { workspace = true }
services = { workspace = true }
api-rest = { workspace = true }
sea-orm-migration = { workspace = true }
axum = { workspace = true }

# Local database engine (SQLite-compatible; no containers / testcontainers).
# Default features off: we only need the local SQLite-compatible engine, not
# full-text search (`fts`) or the mimalloc allocator.
turso = { version = "0.7", default-features = false }

# Temp directories for the per-test Turso database + media storage.
tempfile = "3"
