# release-plz configuration.
#
# This project releases as a Docker image + Helm chart on GitHub, NOT on
# crates.io. `publish = false` disables `cargo publish`, so nothing is ever
# pushed to a cargo registry. Merging a release PR makes release-plz bump the
# workspace version, update the changelogs, push `<package>-v<version>` git
# tags and create the GitHub Releases for those tags (the binaries/installers
# for `server-bin` are attached to its release by cargo-dist).
#
# `git_only` is deliberately NOT enabled. In git-only mode release-plz
# reconstructs the workspace at the previous release tag and runs
# `cargo package --allow-dirty --workspace --no-verify` inside it to diff
# package contents. That is impossible for this workspace: `services` and
# `workflow` depend on `ows-runtime*` (not published on crates.io) and older
# revisions declare internal path dependencies without version requirements,
# so that command always fails. With registry mode + `publish = false`,
# release-plz diffs purely from git and never queries the registry for
# packages it does not publish.

[workspace]
# Never publish to a cargo registry (versions come from Cargo.toml + commits).
publish = false
git_only = false

# Only release when a release-plz PR is merged, not on every main commit.
# Matches "when release-plz pr is merged it should do normal release".
release_always = false

# Create a GitHub Release for every pushed package tag. The `server-bin`
# release additionally receives the cargo-dist archives/installer, which are
# uploaded by `.github/workflows/release.yml` (dist runs with
# `create-release = false`, i.e. it only attaches artifacts to this release).
git_release_enable = true

# Run cargo-semver-checks on each release PR. Versions are bumped from the
# git tags of the previous release.
semver_check = true

# Add a recognizable label to the release PRs.
pr_labels = ["release"]

# Keep changelog generation on for every package.
changelog_update = true
