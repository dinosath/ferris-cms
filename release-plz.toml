# release-plz configuration.
#
# This project releases as a Docker image + Helm chart on GitHub, NOT on
# crates.io. `publish = false` disables `cargo publish`, so nothing is ever
# pushed to a cargo registry. Merging a release PR makes release-plz bump the
# workspace version, update the changelogs and push the `<package>-v<version>`
# git tags (`git_release_enable = false`, so it does NOT create a GitHub
# Release per crate).
#
# The only GitHub Release is the single `v<version>` release for the whole
# application. `.github/workflows/release-plz.yml` creates it (published, on the
# `v<version>` tag it creates first) with the install instructions
# (`curl ... | sh`, Docker, Helm) in its body; cargo-dist then uploads the shell
# installer / archives to it and `build.yml` attaches the image tarball and the
# Helm chart.
#
# The per-package git tags are kept, but they are internal: they carry no
# GitHub Release and nothing is downloaded from them. release-plz treats
# "tag already exists" as "this version was already released": with
# `publish = false` it takes the git-only path in `release_package_if_needed`
# and never queries a registry, so the tags are the record of what has been
# released.
#
# `git_only` is deliberately NOT enabled. In git-only mode release-plz
# reconstructs the workspace at the previous release tag and runs
# `cargo package --allow-dirty --workspace --no-verify` inside it to diff
# package contents. That is impossible for this workspace: `services` and
# `workflow` depend on `ows-runtime*` (not published on crates.io) and older
# revisions declare internal path dependencies without version requirements,
# so that command always fails. With registry mode + `publish = false`,
# release-plz diffs purely from git and never queries the registry for
# packages it does not publish.

[workspace]
# Never publish to a cargo registry (versions come from Cargo.toml + commits).
publish = false
git_only = false

# Only release when a release-plz PR is merged, not on every main commit.
# Matches "when release-plz pr is merged it should do normal release".
release_always = false

# Do NOT create a GitHub Release for every pushed package tag: that would show
# up as one release per crate (14 of them per version). release-plz still pushes
# the git tags, but the single user-facing `v<version>` release is created by
# `.github/workflows/release-plz.yml` (body from `scripts/release_notes.sh`) and
# filled in by cargo-dist (`release.yml`) and `build.yml`.
git_release_enable = false

# Do NOT run cargo-semver-checks from release-plz. With `publish = false` the
# packages are never on crates.io, so release-plz would compare against the very
# old published versions (0.1.x) and report breaking changes on every release,
# forcing a minor bump even for changelog-only diffs. The `Checks` workflow runs
# cargo-semver-checks against the last release tag instead, and those statuses
# are required on main.
semver_check = false

# Add a recognizable label to the release PRs.
pr_labels = ["release"]

# Keep changelog generation on for every package.
changelog_update = true
