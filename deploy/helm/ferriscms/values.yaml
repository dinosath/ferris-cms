replicaCount: 1

image:
  repository: ghcr.io/dinosath/ferris-cms
  # Override the tag; defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 1337

# Initial Super Admin that the server auto-provisions on first boot (when no
# admin exists). The credentials are injected as ADMIN_USERNAME / ADMIN_PASSWORD
# env vars from a ConfigMap. Username defaults to "admin"; the password is
# generated randomly at install time when left empty and persisted in the chart's
# ConfigMap (so it is stable across upgrades). Log in with the username (or the
# derived ADMIN_EMAIL) plus ADMIN_PASSWORD.
admin:
  username: "admin"
  # Leave empty to auto-generate a strong random password on install.
  password: ""
  # Optional email; defaults to "<username>@ferriscms.local".
  email: ""

# Environment variables passed to the server container.
# Each value is either a plain string (injected literally) or an object of the
# form { valueFrom: { secretKeyRef: { name: ..., key: ... } } } to pull a value
# from a Kubernetes Secret (recommended for secrets such as DATABASE_URL,
# JWT_SECRET and OIDC_CLIENT_SECRET so they never live in version control).
#
#   env:
#     DATABASE_URL:
#       valueFrom:
#         secretKeyRef:
#           name: ferriscms-secrets
#           key: DATABASE_URL
#
# The webserver uses PostgreSQL. Set DATABASE_URL to your database
# (e.g. postgres://user:password@postgres:5432/ferriscms).
env:
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/ferriscms"
  JWT_SECRET: "change-me-in-production"
  MEDIA_STORAGE_DIR: "/data/media"
  BIND_ADDR: "0.0.0.0:1337"
  RUST_LOG: "info"

# Ingress (optional) to expose the admin UI + REST API.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ferriscms.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistent storage for uploaded media (the database is external PostgreSQL).
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
