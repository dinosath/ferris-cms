apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferriscms.fullname" . }}
  labels:
    {{- include "ferriscms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ferriscms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ferriscms.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ferriscms
          image: {{ include "ferriscms.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 1337
              protocol: TCP
          # Admin bootstrap credentials (username + generated password) come
          # from the admin ConfigMap and are injected as env vars.
          envFrom:
            - configMapRef:
                name: {{ include "ferriscms.fullname" . }}-admin
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              {{- if kindIs "string" $value }}
              value: {{ $value | quote }}
              {{- else if $value.valueFrom }}
              {{- toYaml $value | nindent 14 }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /admin/init
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /admin/init
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ferriscms.fullname" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
