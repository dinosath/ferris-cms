name: Build images & charts

# Builds the Docker image and Helm chart and publishes them to GHCR.
# Mode is chosen from the triggering ref:
#   - release tag (e.g. `v0.3.1`)              -> stable `v<ver>` image
#   - push to `main`                           -> RC image `<ver>.rc-<run_number>`
#   - push to any other branch                 -> `run-<run_number>` image
# Stable release images are kept indefinitely; `rc-*` and `run-*` images are
# pruned by cleanup.yml after 30 days.
#
# For a release it also finishes the single GitHub Release for the version
# (`v<version>`, created by cargo-dist in `release.yml`): it attaches the
# `docker save`d image tarball and the packaged Helm chart, and appends the
# Docker/Helm instructions to the release body (cargo-dist already put the
# `curl ... | sh` shell-installer instructions there).

on:
  push:
  # The tag is created via the API by the Release-plz workflow, which then
  # dispatches this workflow explicitly (tags created with the default
  # GITHUB_TOKEN do not trigger workflows). The dispatch ref is `main` (and not
  # the tag) because the workflow file stored at the tag's commit may predate
  # the `workflow_dispatch` trigger.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must already exist), e.g. v0.3.1"
        required: false
        type: string
      pr:
        description: "Pull request number to build in no-push mode (used to validate a release PR)"
        required: false
        type: string
  # Pull requests build the image and lint/package the chart *without pushing*
  # anything, so a PR (in particular the release PR) is validated by the same
  # build that produces the release artifacts.
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/<owner>/ferris-cms
  CHART_OCI: ${{ github.repository_owner }}/ferriscms-charts

jobs:
  build:
    name: Build image & chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # One group per release tag and per pull request, so that a new commit on a
    # PR supersedes its own build. Validation builds dispatched by the
    # Release-plz workflow carry neither and share the `rc` group.
    concurrency:
      group: build-${{ github.event.inputs.tag || github.event.pull_request.number || 'rc' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the source of the release tag when dispatched manually.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # ------------------------------------------------------------------
      # Determine the image tag / chart version for this ref.
      # ------------------------------------------------------------------
      - name: Determine tags
        id: tags
        run: |
          # Current workspace version (e.g. 0.1.0) used as the base for rc/run tags.
          BASE=$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          BASE=${BASE:-0.1.0}

          # A manual dispatch (from the Release-plz workflow) passes the release
          # tag as an input; otherwise use the ref that triggered the run.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF_TYPE=tag
            REF_NAME="${{ github.event.inputs.tag }}"
          else
            REF_TYPE="$GITHUB_REF_TYPE"
            REF_NAME="$GITHUB_REF_NAME"
          fi

          echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          echo "IS_PR=false" >> "$GITHUB_ENV"

          # Pull requests (and manual dispatches that pass a PR number, which
          # is how the Release-plz workflow validates its release PR): build and
          # validate, but never publish.
          EVENT="${{ github.event_name }}"
          INPUT_TAG="${{ github.event.inputs.tag }}"
          INPUT_PR="${{ github.event.inputs.pr }}"
          if [ "$EVENT" = "pull_request" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ -z "$INPUT_TAG" ] && [ -n "$INPUT_PR" ]; }; then
            PR_NUMBER="${INPUT_PR:-${{ github.event.pull_request.number }}}"
            echo "IS_PR=true" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=pr-$PR_NUMBER" >> "$GITHUB_ENV"
            echo "CHART_VERSION=$BASE-pr.$PR_NUMBER" >> "$GITHUB_ENV"
            echo "APP_VERSION=$BASE" >> "$GITHUB_ENV"
            echo "PR build: image $BASE-pr.$PR_NUMBER (not pushed)"
            exit 0
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            # The application release tag is plain `v0.3.1`; the older
            # per-crate `server-bin-v0.3.1` form is still accepted.
            VER="$REF_NAME"
            VER="${VER##*-v}"
            VER="${VER#v}"
            if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "IS_RELEASE=true" >> "$GITHUB_ENV"
              echo "IMAGE_TAG=v$VER" >> "$GITHUB_ENV"
              echo "CHART_VERSION=$VER" >> "$GITHUB_ENV"
              echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
              echo "Base release version: $VER"
              exit 0
            fi
          fi

          if [ "$REF_NAME" = "main" ] && [ "$REF_TYPE" = "branch" ]; then
            # rc images carry the workspace version + run number, e.g. 0.2.0.rc-3
            echo "IMAGE_TAG=$BASE.rc-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "CHART_VERSION=$BASE-rc.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$BASE.run-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "CHART_VERSION=$BASE-run.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION=$BASE" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Docker image
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Required for the GHA cache backend (cache-from/cache-to below);
          # the default `docker` driver does not support cache export.
          driver: docker-container

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # PRs build the image to validate it, but never publish it.
          push: ${{ env.IS_PR != 'true' }}
          # Persist the BuildKit cache (including the cargo /app/target cache
          # mount) to the GitHub Actions cache. This is reused by subsequent
          # runs and by retries after a failed build, so the expensive Rust
          # dependency compilation is only done once instead of on every run.
          # `ignore-error=true` ensures a cache-export failure never fails the
          # whole build.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      # ------------------------------------------------------------------
      # Helm chart
      # ------------------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Lint and package chart
        run: |
          helm lint deploy/helm/ferriscms
          helm package deploy/helm/ferriscms \
            --version "${{ env.CHART_VERSION }}" \
            --app-version "${{ env.APP_VERSION }}" \
            -d dist/

      - name: Login to GHCR (helm)
        if: env.IS_PR != 'true'
        env:
          HELM_EXPERIMENTAL_OCI: "1"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin

      # Immutability: never overwrite a published chart version. If it already
      # exists in the OCI registry, keep the existing artifact.
      - name: Check chart immutability
        if: env.IS_PR != 'true'
        env:
          HELM_EXPERIMENTAL_OCI: "1"
        run: |
          if helm show chart "oci://${{ env.REGISTRY }}/${{ env.CHART_OCI }}/ferriscms" \
               --version "${{ env.CHART_VERSION }}" >/dev/null 2>&1; then
            echo "CHART_EXISTS=true" >> "$GITHUB_ENV"
            echo "::notice::Chart ${{ env.CHART_VERSION }} already exists; not overwriting (immutable)."
          fi

      - name: Push chart to GHCR
        if: env.IS_PR != 'true' && env.CHART_EXISTS != 'true'
        env:
          HELM_EXPERIMENTAL_OCI: "1"
        run: |
          helm push "dist/ferriscms-${{ env.CHART_VERSION }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ env.CHART_OCI }}"

      # ------------------------------------------------------------------
      # Export the image as a gzipped tarball so the release has a downloadable
      # image in addition to the OCI copy in GHCR.
      # ------------------------------------------------------------------
      - name: Export image tarball
        if: env.IS_RELEASE == 'true'
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker pull "$REF"
          docker save "$REF" | gzip -6 > "dist/ferriscms-image-${{ env.APP_VERSION }}.tgz"
          ls -lh dist/

      # ------------------------------------------------------------------
      # Finish the single `v<version>` GitHub Release: cargo-dist creates it
      # (with the curl/shell-installer instructions), we add the chart + image
      # tarball and the Docker/Helm instructions.
      # ------------------------------------------------------------------
      - name: Attach chart + image to the GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ env.APP_VERSION }}
          TAG: v${{ env.APP_VERSION }}
        run: |
          mkdir -p dist
          {
            printf 'image: %s@%s\n' "$IMAGE" "$DIGEST"
            printf 'image-tarball: ferriscms-image-%s.tgz\n' "$VERSION"
            printf 'chart: oci://%s/%s/ferriscms:%s\n' "${{ env.REGISTRY }}" "${{ env.CHART_OCI }}" "$VERSION"
          } > dist/release-artifacts.txt

          # cargo-dist creates the release (as a draft) on the v<version> tag.
          for _ in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::release $TAG not found yet; skipping chart/image attachment"
            exit 0
          fi

          existing=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          for f in \
            "dist/ferriscms-${VERSION}.tgz" \
            "dist/ferriscms-image-${VERSION}.tgz" \
            dist/release-artifacts.txt; do
            b=$(basename "$f")
            if printf '%s\n' "$existing" | grep -qx "$b"; then
              echo "::notice::$b already attached; not overwriting (immutable)."
            else
              gh release upload "$TAG" "$f"
            fi
          done

          # Append the Docker/Helm instructions once. The marker keeps a re-run
          # (or a second build for the same tag) from duplicating the section.
          body=$(gh release view "$TAG" --json body -q '.body' || true)
          if printf '%s' "$body" | grep -q 'ferriscms-install-notes'; then
            echo "::notice::install notes already present on $TAG; leaving the body unchanged."
            exit 0
          fi
          notes="dist/release-notes.md"
          {
            printf '%s\n\n' "$body"
            printf '<!-- ferriscms-install-notes -->\n'
            printf '## Install the server with Docker\n\n'
            printf 'The server image is published to GHCR and also attached below as `ferriscms-image-%s.tgz`.\n\n' "$VERSION"
            printf '```sh\n'
            printf 'docker pull %s\n' "$IMAGE"
            printf '# or load the attached tarball:\n'
            printf 'docker load < ferriscms-image-%s.tgz\n' "$VERSION"
            printf '```\n\n'
            printf 'Run it against PostgreSQL:\n\n'
            printf '```sh\n'
            printf '%s\n' 'docker run --rm -p 1337:1337 \'
            printf '%s\n' "  -e DATABASE_URL='postgres://user:pass@host:5432/ferriscms' \\"
            printf '%s\n' "  -e JWT_SECRET='change-me-in-production' \\"
            printf '%s\n' '  -e MEDIA_STORAGE_DIR=/data/media \'
            printf '%s\n' '  -v ferriscms-media:/data/media \'
            printf '  %s\n' "$IMAGE"
            printf '```\n\n'
            printf '## Install the Helm chart\n\n'
            printf '```sh\n'
            printf 'helm install ferriscms oci://%s/%s/ferriscms --version %s\n' "${{ env.REGISTRY }}" "${{ env.CHART_OCI }}" "$VERSION"
            printf '# or from the attached chart tarball:\n'
            printf 'helm install ferriscms ferriscms-%s.tgz\n' "$VERSION"
            printf '```\n'
          } > "$notes"
          gh release edit "$TAG" --notes-file "$notes"

      # ------------------------------------------------------------------
      # Enable GitHub immutable releases (assets/tags can't be changed after
      # publication). Requires a repo-admin token; skipped when unset.
      # ------------------------------------------------------------------
      - name: Enable immutable releases
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::REPO_ADMIN_TOKEN not set; enable immutable releases once in repo settings (Settings -> General -> Releases)."
            exit 0
          fi
          gh api --method PUT "repos/${{ github.repository }}/immutable-releases" >/dev/null \
            && echo "immutable releases enabled"
