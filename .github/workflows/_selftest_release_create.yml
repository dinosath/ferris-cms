name: Release-create selftest (temporary)

# TEMPORARY, DELETE AFTER USE.
#
# Closes the last unobserved link in the release pipeline: the
# `.github/workflows/release-plz.yml` release job runs
# `gh release create v<version> --title <version> --notes-file <file>` with the
# workflow's own GITHUB_TOKEN. Every other write in that job is already proven
# in CI (GITHUB_TOKEN created the `v0.3.1` tag and uploaded all release
# assets), but POST /releases itself never ran under GITHUB_TOKEN, and a repo
# setting (`default_workflow_permissions: read`) makes that permission worth
# confirming rather than assuming.
#
# Creates a throwaway `v0.0.0-selftest` tag + published release and deletes
# both, so it leaves nothing behind.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    name: gh release create under GITHUB_TOKEN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create and delete a throwaway published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.0.0-selftest
          SHA=$(git rev-parse HEAD)

          # Same call the release job makes to create the application tag.
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
          fi

          # Same call the release job makes, minus --target (which is what
          # caused the earlier 403 when it tried to move an existing tag).
          printf 'selftest\n' > dist-release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file dist-release-notes.md

          gh release view "$TAG" --json tagName,isDraft,name -q '{tagName,isDraft,name}'

          gh release delete "$TAG" --yes --cleanup-tag
          echo "SELFTEST OK: GITHUB_TOKEN can create a published release on an existing tag"
